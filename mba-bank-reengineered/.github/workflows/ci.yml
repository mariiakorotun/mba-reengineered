name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Збірка, модульні та архітектурні тести, звіт покриття JaCoCo
        run: ./mvnw -B verify
      - name: Звіт покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Зонд E2E (запуск застосунку з профілем local)
        run: |
          java -jar target/mba-bank-reengineered-*.jar --server.port=8082 &
          for i in $(seq 1 30); do curl -sf http://localhost:8082/login >/dev/null && break; sleep 2; done
          pip install requests beautifulsoup4
          python3 tools/probe.py http://localhost:8082 probe-result.json --strict
