<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вхід | Mini Banking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { margin-top: 10%; max-width: 400px; }
    </style>
</head>
<body>
<div class="container login-container">

    <div th:if="${param.logout}" class="alert alert-success shadow-sm border-0 mb-3">
        ✅ Ви успішно вийшли. До зустрічі!
    </div>

    <div th:if="${param.error}" class="alert alert-danger shadow-sm border-0 mb-3">
        ❌ Неправильний логін або пароль.
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0 fw-bold">🔐 Вхід у систему</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Логін</label>
                    <input type="text" name="username" class="form-control" required placeholder="Введіть ваш логін">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Пароль</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Увійти в кабінет</button>
            </form>
        </div>
    </div>

    <div class="text-center mt-4 text-muted small">
        © 2026 Mini Banking App | Secured by Spring Security
    </div>
</div>
</body>
</html>
